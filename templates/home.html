<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de QR Code — Unimed S.S. do Paraíso</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <main class="card">
        <div class="card__header">
            <img
                class="card__logo"
                src="{{ url_for('static', filename='img/logo 2023.png') }}"
                alt="Unimed S.S. do Paraíso"
            >
            <h1>Gerador de QR Code</h1>
        </div>

        <div class="card__body">
            <form id="qrcode-form" class="panel panel--form" novalidate>
                <div class="field">
                    <label for="link-input" class="field__label">Link</label>
                    <div class="input-group">
                        <input
                            type="text"
                            id="link-input"
                            name="link"
                            placeholder="https://exemplo.com"
                            autocomplete="off"
                            autofocus
                        >
                        <button type="submit" id="generate-btn">
                            <span class="btn-label">Gerar QR Code</span>
                            <span class="btn-spinner" aria-hidden="true"></span>
                        </button>
                    </div>
                </div>

                <div class="customize-section">
                    <div class="field">
                        <span class="field__label">Cor do QR Code</span>
                        <div class="color-field">
                            <div class="swatch-group" id="fill-color-swatches" role="group" aria-label="Cor do QR Code">
                                <button type="button" class="swatch" data-color="#000000" style="--swatch-color:#000000" aria-pressed="true" aria-label="Preto"></button>
                                <button type="button" class="swatch" data-color="#00995d" style="--swatch-color:#00995d" aria-pressed="false" aria-label="Verde"></button>
                                <button type="button" class="swatch" data-color="#004e4c" style="--swatch-color:#004e4c" aria-pressed="false" aria-label="Teal"></button>
                                <button type="button" class="swatch" data-color="#f47920" style="--swatch-color:#f47920" aria-pressed="false" aria-label="Laranja"></button>
                            </div>
                            <label class="color-picker">
                                <input type="color" id="fill-color-picker" value="#000000">
                                <span class="visually-hidden">Cor do QR Code personalizada</span>
                            </label>
                        </div>
                    </div>

                    <div class="field">
                        <span class="field__label">Cor de fundo</span>
                        <div class="color-field">
                            <div class="swatch-group" id="back-color-swatches" role="group" aria-label="Cor de fundo">
                                <button type="button" class="swatch" data-color="#ffffff" style="--swatch-color:#ffffff" aria-pressed="true" aria-label="Branco"></button>
                                <button type="button" class="swatch" data-color="#ece3d9" style="--swatch-color:#ece3d9" aria-pressed="false" aria-label="Bege"></button>
                                <button type="button" class="swatch" data-color="#cde3bb" style="--swatch-color:#cde3bb" aria-pressed="false" aria-label="Verde claro"></button>
                                <button type="button" class="swatch" data-color="#a4d8de" style="--swatch-color:#a4d8de" aria-pressed="false" aria-label="Azul claro"></button>
                            </div>
                            <label class="color-picker">
                                <input type="color" id="back-color-picker" value="#ffffff">
                                <span class="visually-hidden">Cor de fundo personalizada</span>
                            </label>
                        </div>
                    </div>

                    <div class="preview-example">
                        <svg id="color-preview" class="preview-example__qr" viewBox="0 0 21 21" aria-hidden="true">
                            <rect width="21" height="21" fill="var(--color-preview-bg)"/>

                            <rect x="0" y="0" width="7" height="7" fill="var(--color-preview-fill)"/>
                            <rect x="1" y="1" width="5" height="5" fill="var(--color-preview-bg)"/>
                            <rect x="2" y="2" width="3" height="3" fill="var(--color-preview-fill)"/>

                            <rect x="14" y="0" width="7" height="7" fill="var(--color-preview-fill)"/>
                            <rect x="15" y="1" width="5" height="5" fill="var(--color-preview-bg)"/>
                            <rect x="16" y="2" width="3" height="3" fill="var(--color-preview-fill)"/>

                            <rect x="0" y="14" width="7" height="7" fill="var(--color-preview-fill)"/>
                            <rect x="1" y="15" width="5" height="5" fill="var(--color-preview-bg)"/>
                            <rect x="2" y="16" width="3" height="3" fill="var(--color-preview-fill)"/>

                            <rect x="9" y="1" width="1" height="1" fill="var(--color-preview-fill)"/>
                            <rect x="11" y="2" width="1" height="1" fill="var(--color-preview-fill)"/>
                            <rect x="9" y="4" width="1" height="1" fill="var(--color-preview-fill)"/>
                            <rect x="17" y="9" width="1" height="1" fill="var(--color-preview-fill)"/>
                            <rect x="19" y="11" width="1" height="1" fill="var(--color-preview-fill)"/>
                            <rect x="17" y="13" width="1" height="1" fill="var(--color-preview-fill)"/>
                            <rect x="2" y="9" width="1" height="1" fill="var(--color-preview-fill)"/>
                            <rect x="4" y="11" width="1" height="1" fill="var(--color-preview-fill)"/>
                            <rect x="9" y="9" width="1" height="1" fill="var(--color-preview-fill)"/>
                            <rect x="11" y="11" width="1" height="1" fill="var(--color-preview-fill)"/>
                            <rect x="9" y="13" width="1" height="1" fill="var(--color-preview-fill)"/>
                            <rect x="13" y="17" width="1" height="1" fill="var(--color-preview-fill)"/>
                            <rect x="15" y="19" width="1" height="1" fill="var(--color-preview-fill)"/>
                            <rect x="9" y="17" width="1" height="1" fill="var(--color-preview-fill)"/>
                            <rect x="11" y="19" width="1" height="1" fill="var(--color-preview-fill)"/>
                        </svg>
                        <span class="preview-example__label">Exemplo com as cores escolhidas</span>
                    </div>

                    <div class="field">
                        <span class="field__label">Tamanho</span>
                        <div class="size-options">
                            <input type="radio" name="size" id="size-small" value="small" class="visually-hidden">
                            <label for="size-small">Pequeno<small>200px</small></label>

                            <input type="radio" name="size" id="size-medium" value="medium" class="visually-hidden" checked>
                            <label for="size-medium">Médio<small>400px</small></label>

                            <input type="radio" name="size" id="size-large" value="large" class="visually-hidden">
                            <label for="size-large">Grande<small>800px</small></label>

                            <input type="radio" name="size" id="size-extra-large" value="extra_large" class="visually-hidden">
                            <label for="size-extra-large">Extra Grande<small>1200px</small></label>
                        </div>
                    </div>

                    <div class="field">
                        <label for="border-input" class="field__label">Borda</label>
                        <div class="border-control">
                            <input type="range" id="border-input" min="0" max="20" value="4">
                            <span id="border-value" class="border-value">4</span>
                        </div>
                    </div>

                    <button type="button" id="reset-customize" class="reset-btn">Restaurar padrão</button>
                </div>

                <p id="error-message" class="error-message" role="alert" hidden></p>
            </form>

            <section class="panel panel--result">
                <div id="result-placeholder" class="result-placeholder">
                    <svg viewBox="0 0 24 24" width="48" height="48" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <rect x="3" y="3" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.8"/>
                        <rect x="14" y="3" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.8"/>
                        <rect x="3" y="14" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.8"/>
                        <path d="M14 14h3v3h-3zM19 14h2v2h-2zM14 19h2v2h-2zM19 19h2v2h-2z" fill="currentColor"/>
                    </svg>
                    <p>Seu QR Code vai aparecer aqui</p>
                </div>

                <div id="result" class="result" hidden>
                    <div class="result__qrcode">
                        <img id="qrcode-image" alt="QR Code gerado" width="220" height="220">
                    </div>
                    <a id="download-link" class="download-btn" download="qrcode.png">
                        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M12 3v12m0 0l-4-4m4 4l4-4M5 19h14" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                        Baixar QR Code
                    </a>
                </div>
            </section>
        </div>
    </main>

    <footer class="site-footer">
        <img
            class="site-footer__seal"
            src="{{ url_for('static', filename='img/logo com iso.png') }}"
            alt="Unimed S.S. do Paraíso — Certificação ISO 9001"
        >
    </footer>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
